name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Evidence lint against pull request range
        if: github.event_name == 'pull_request'
        run: >-
          uv run python scripts/lint_rule_evidence.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      # 全零 `before` 代表「這個 ref 是被本次 push 建立的」，此時沒有可用的比較基準。
      # 這裡略過是安全的，不是覆蓋缺口：上方 `on:` 把 push 限定在 `branches: [main]`，
      # 而 main 只會被建立一次；新分支根本不觸發本 workflow，其 evidence lint 涵蓋來自
      # 上面的 pull_request step。（PR #347 re-review 提出「新分支首次 push 略過 lint」，
      # 經 trigger 範圍確認前提不成立——若日後把 push 觸發放寬到其他分支，這條就要改成
      # 與預設分支算 merge base。）
      - name: Evidence lint against pushed range
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          uv run python scripts/lint_rule_evidence.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"

      - name: Lint, format, type check, security (pre-commit)
        run: uv run pre-commit run --all-files

      - name: Test
        run: uv run pytest --tb=short

      # ADR-0004 Phase 1 的交付物是「tasks/ 可經 uv tool install 安裝並執行」。
      # pytest 全部從源碼樹 import，證明不了這件事——entry point 打錯、packages 寫錯、
      # exclude 過寬，測試全數照綠，缺陷會先在使用者的安裝現場爆而非 CI。
      # 不能用 @pytest.mark.slow 涵蓋：addopts = "-m 'not slow'" 連 CI 都 deselect。
      - name: Packaging smoke test (wheel installs and runs standalone)
        run: bash scripts/packaging_smoke_test.sh
