repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        exclude: ^(openspec|docs/openspec)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy tasks/
        language: system
        types: [python]
        pass_filenames: false
        files: ^tasks/

      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        files: ^tasks/

      - id: lint-shell-syntax
        name: lint-shell-syntax (bash -n)
        entry: bash scripts/lint_shell_syntax.sh
        language: system
        pass_filenames: true
        types: [shell]

      - id: lint-shell-subshell-exit
        name: lint-shell-subshell-exit (exit in $()-called function, advisory)
        entry: python3 scripts/lint_shell_subshell_exit.py
        language: system
        pass_filenames: true
        types: [shell]
        verbose: true  # advisory：script 預設 exit 0，verbose 讓 [WARN] 在通過時仍顯示（見 PR #241 mob review）

      - id: lint-skill-bash
        name: lint-skill-bash
        entry: python3 scripts/lint_skill_bash.py
        language: system
        pass_filenames: false
        # always_run，不用 files: —— pre-commit 的 staged-file 清單用
        # --diff-filter=ACMRTUXB（不含 D），deletion-only commit 不會匹配任何 files:
        # pattern，讓這個 hook 完全不觸發。而 `git rm plugins/<pack>/commands/<cmd>.md`
        # 漏改頂層 symlink，正是本 hook 要擋的 dangling-symlink 失誤——deletion-only
        # 形狀恰好是最需要它的時候。script 本身 pass_filenames: false，已經是 repo-wide
        # 掃描，files: 在這裡只買到「跳過無關 commit 的速度」，代價是漏掉 deletion。
        always_run: true

      - id: lint-skill-scope
        name: lint-skill-scope
        entry: python3 scripts/lint_skill_scope.py
        language: system
        pass_filenames: false
        files: ^(skills/.*/SKILL\.md|\.claude-plugin/marketplace\.json)$

      - id: lint-plugin-layout
        name: lint-plugin-layout
        entry: python3 scripts/lint_plugin_layout.py
        language: system
        pass_filenames: false
        # always_run，理由同 lint-skill-bash：pre-commit 的 --diff-filter=ACMRTUXB
        # 不含 D，deletion-only commit（如 `git rm -r plugins/<pack>`）不會匹配任何
        # files: pattern，讓這個 hook 完全不觸發——而那正是本 hook 要擋的「搬動 / 刪除
        # plugin 端而漏改頂層」失誤最常見的形狀。script 本身已是 repo-wide 掃描。
        always_run: true

      - id: lint-rule-frontmatter
        name: lint-rule-frontmatter
        entry: python3 scripts/lint_rule_frontmatter.py
        language: system
        pass_filenames: false
        files: ^\.claude/rules/.*\.md$

      - id: lint-rule-evidence
        name: lint-rule-evidence
        entry: python3 scripts/lint_rule_evidence.py
        language: system
        pass_filenames: false
        # 含 .pre-commit-config.yaml 自身（AC-6 明列的新註冊 hook 來源之一，先前遺漏於此
        # 觸發範圍，導致只改本檔就不會觸發此 hook）與 CLAUDE.md（rule 11 對 always-loaded
        # 的定義包含它，見 lint_rule_evidence.py 的 _EXISTING_ALWAYS_LOADED_DOC_RE）。
        files: ^(\.claude/(rules/.*\.md|hooks/.*|settings\.json)|\.pre-commit-config\.yaml|CLAUDE\.md)$
        verbose: true  # advisory：既有檔新 section 缺證據只 [WARN]（起步期不擋），verbose 讓警告在通過時仍顯示（見 retro-evidence-gate）

      - id: lint-skill-overlap
        name: lint-skill-overlap
        entry: python3 scripts/lint_skill_overlap.py
        language: system
        pass_filenames: false
        files: ^(skills/.*/SKILL\.md|plugins/.*/skills/.*/SKILL\.md|scripts/lint_skill_overlap\.py)$
        verbose: true

      # 阻擋型（非 warn-only）：違規的形狀單一且判準精確，負向對照已逐條測過
      # （${N} / \$N / $10 / fence 外 / 非 shell fence 各一），誤報風險低。
      # 這與 lint-skill-overlap 走 advisory 的理由相反——那個量的是 Jaccard 相似度，
      # 本質上是啟發式；這個判的是「這個字面形式會不會被 substitution 換掉」，是事實。
      - id: lint-skill-positional-refs
        name: lint-skill-positional-refs
        entry: python3 scripts/lint_skill_positional_refs.py
        language: system
        pass_filenames: false
        files: ^(skills/.*/SKILL\.md|plugins/.*/(skills/.*/SKILL\.md|commands/.*\.md)|commands/.*\.md|scripts/lint_skill_positional_refs\.py)$

      - id: check-blank-proposal
        name: check-blank-proposal
        entry: python3 scripts/check_blank_proposal.py
        language: system
        pass_filenames: true
        files: ^openspec/changes/.*/proposal\.md$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
